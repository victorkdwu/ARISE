# ARISE preset: HorusEye x IoT
TARGET: horuseye
TARGET_DIR: targets/horuseye
PROTOCOL: v1
INPUT_SIZE: 105
SEED: 20
DBSCAN_MIN_SAMPLES: 10
DBSCAN_EPS: 0.0
ANCHOR_RATIO: 0.001
FT_LR: 0.0001
FT_WD: 0.0001
FT_EPOCHS: 20
FT_BATCH: 256
FT_ACCUM: 12
normal_dir: ../../data/horuseye/normal-kitsune_test/
attack_dir: ../../data/horuseye/Anomaly/attack_kitsune/
NORMAL_SPLIT_MODE: file_slice
NORMAL_TRAIN_BEGIN: 0
NORMAL_TRAIN_END: 4
NORMAL_TEST_BEGIN: 4
NORMAL_TEST_END: 6
FEATURE_HAS_FLOWID: true
DROP_HEADER_ROWS: 0
V1_LOADER: blur
V1_OVERALL_FILTER: true
blur_attack_dict:
  botnet: [mirai_kit_abnormal, aidra, mirai_router_filter, bashlite]
  ddos:   [tcp_ddos, udp_ddos, http_ddos]
  scan:   [os_scan, service_scan]
  theft:  [data_theft, keylogging]
params_dir: ./params/horuseye_iot/
model_load_path: ./params/horuseye_iot/base.pkl
RESULTS_V2: ../../results/horuseye_iot
BENIGN_CACHE_DIR: ../../results/cache
