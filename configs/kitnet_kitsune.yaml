# ARISE preset: KitNET x Kitsune
TARGET: kitnet
TARGET_DIR: targets/kitnet
PROTOCOL: v1
KITNET_UNTIE: true
SEED: 20
DBSCAN_MIN_SAMPLES: 10
DBSCAN_EPS: 0.0
ANCHOR_RATIO: 0.001
FT_LR: 0.0001
FT_WD: 0.0001
FT_EPOCHS: 20
FT_BATCH: 256
FT_ACCUM: 1
normal_dir: ../../data/kitnet_kitsune/normal/
attack_dir: ../../data/kitnet_kitsune/attack/
V1R:
  reader: keep
  drop_cols: []
  file_end: 20
  benign_test: {mode: dir, subdir: test/}
  benign_train: {mode: dir, subdir: train/}
  perclass_mult: 2
  overall_types: all
  overall_benign: raw
blur_attack_dict:
  botnet: [Mirai_Botnet]
  ddos:   [SSDP_Flood, SYN_DoS, SSL_Renegotiation]
  scan:   [OS_Scan, Fuzzing]
  MitM:   [Video_Injection, ARP_MitM, Active_Wiretap]
params_dir: ./params/kitnet_kitsune/
model_load_path: ./params/kitnet_kitsune/base.pt
BASE_EPOCHS: 30
BASE_LR: 0.0005
BASE_WD: 0.0001
BASE_BATCH: 32
BASE_PATIENCE: 3
RESULTS_V2: ../../results/kitnet_kitsune
BENIGN_CACHE_DIR: ../../results/cache
